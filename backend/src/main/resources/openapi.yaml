        '200':
          description: Solicitud atendida
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/HTTP401'
        '404':
          $ref: '#/components/responses/HTTP404'
        '422':
          $ref: '#/components/responses/HTTP422'
  /alertas:
