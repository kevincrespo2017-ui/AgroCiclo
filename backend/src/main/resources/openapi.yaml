openapi: 3.0.3
info:
  title: AgroCiclo API REST
  version: 2.0.0
  description: Caso 09. Inicia sesión, copia el token de la respuesta y úsalo en Authorize
    sin escribir el prefijo Bearer.
servers:
- url: /api
security:
- sesionBearer: []
paths:
  /salud:
    get:
      tags:
      - Sistema
      summary: Comprobar API y conexión PostgreSQL
      security: []
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                type: object
                required:
                - estado
                - base_de_datos
                properties:
                  estado:
                    type: string
                  base_de_datos:
                    type: string
        '503':
          $ref: '#/components/responses/HTTP503'
  /openapi.json:
    get:
      tags:
      - Sistema
      summary: Obtener la especificación OpenAPI
      security: []
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                type: object
  /auth/login:
    post:
      tags:
      - Sesión
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '401':
          $ref: '#/components/responses/HTTP401'
        '422':
          $ref: '#/components/responses/HTTP422'
        '429':
          $ref: '#/components/responses/HTTP429'
  /auth/me:
    get:
      tags:
      - Sesión
      summary: Obtener el perfil actual
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/HTTP401'
  /auth/logout:
    post:
      tags:
      - Sesión
      summary: Revocar la sesión actual
      responses:
        '204':
          description: Operación completada
        '401':
          $ref: '#/components/responses/HTTP401'
  /terrenos:
    get:
      tags:
      - Catálogos
      summary: Listar terrenos
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Terreno'
        '401':
          $ref: '#/components/responses/HTTP401'
    post:
      tags:
      - Catálogos
      summary: Registrar terreno (administrador o supervisor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerrenoEntrada'
      responses:
        '201':
          description: Registro creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terreno'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
  /terrenos/{id}:
    put:
      tags:
      - Catálogos
      summary: Editar terreno (administrador o supervisor)
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerrenoEntrada'
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terreno'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
    delete:
      tags:
      - Catálogos
      summary: Eliminar terreno sin vínculos (administrador)
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      responses:
        '204':
          description: Operación completada
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
  /cultivos:
    get:
      tags:
      - Catálogos
      summary: Listar cultivos
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cultivo'
        '401':
          $ref: '#/components/responses/HTTP401'
    post:
      tags:
      - Catálogos
      summary: Registrar cultivo (administrador o supervisor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CultivoEntrada'
      responses:
        '201':
          description: Registro creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cultivo'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
  /cultivos/{id}:
    put:
      tags:
      - Catálogos
      summary: Editar cultivo (administrador o supervisor)
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CultivoEntrada'
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cultivo'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
    delete:
      tags:
      - Catálogos
      summary: Eliminar cultivo sin vínculos (administrador)
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      responses:
        '204':
          description: Operación completada
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
  /insumos:
    get:
      tags:
      - Catálogos
      summary: Listar insumos
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Insumo'
        '401':
          $ref: '#/components/responses/HTTP401'
    post:
      tags:
      - Catálogos
      summary: Registrar insumo (administrador o supervisor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsumoEntrada'
      responses:
        '201':
          description: Registro creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insumo'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
  /insumos/{id}:
    put:
      tags:
      - Catálogos
      summary: Editar insumo (administrador o supervisor)
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsumoEntrada'
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insumo'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
    delete:
      tags:
      - Catálogos
      summary: Eliminar insumo sin vínculos (administrador)
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      responses:
        '204':
          description: Operación completada
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
  /ciclos:
    get:
      tags:
      - Ciclos
      summary: Buscar, filtrar y paginar ciclos
      parameters:
      - name: pagina
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: tam
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
        description: Busca por código, terreno o cultivo.
      - name: estado
        in: query
        schema:
          type: string
          enum:
          - PLANIFICADO
          - SEMBRADO
          - CERRADO
      - name: cultivoId
        in: query
        schema:
          type: integer
          minimum: 1
      - name: terrenoId
        in: query
        schema:
          type: integer
          minimum: 1
      - name: desde
        in: query
        schema:
          type: string
          format: date
        description: Inicio de ciclo desde esta fecha.
      - name: hasta
        in: query
        schema:
          type: string
          format: date
      - name: ordenar
        in: query
        schema:
          type: string
          enum:
          - fechaInicio
          - codigo
          - rendimiento
          - costo
          default: fechaInicio
      - name: direccion
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaCicloResumen'
        '401':
          $ref: '#/components/responses/HTTP401'
        '422':
          $ref: '#/components/responses/HTTP422'
    post:
      tags:
      - Ciclos
      summary: Planificar un ciclo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CicloEntrada'
      responses:
        '201':
          description: Registro creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ciclo'
        '401':
          $ref: '#/components/responses/HTTP401'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
  /ciclos/{id}:
    get:
      tags:
      - Ciclos
      summary: Ver ciclo, actividades, consumos y cosechas
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CicloDetalle'
        '401':
          $ref: '#/components/responses/HTTP401'
        '404':
          $ref: '#/components/responses/HTTP404'
        '422':
          $ref: '#/components/responses/HTTP422'
    put:
      tags:
      - Ciclos
      summary: Editar un ciclo planificado
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CicloEntrada'
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ciclo'
        '401':
          $ref: '#/components/responses/HTTP401'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
    delete:
      tags:
      - Ciclos
      summary: Retirar un ciclo planificado sin registros (administrador)
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      responses:
        '204':
          description: Operación completada
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
  /ciclos/{id}/sembrar:
    post:
      tags:
      - Ciclos
      summary: Confirmar la siembra
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Fecha'
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ciclo'
        '401':
          $ref: '#/components/responses/HTTP401'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
  /ciclos/{id}/cerrar:
    post:
      tags:
      - Ciclos
      summary: Cerrar el ciclo (administrador o supervisor)
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Fecha'
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ciclo'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
  /ciclos/{id}/actividades:
    post:
      tags:
      - Operaciones
      summary: Programar una actividad
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActividadEntrada'
      responses:
        '201':
          description: Registro creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actividad'
        '401':
          $ref: '#/components/responses/HTTP401'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
  /ciclos/{id}/actividades/{actividadId}:
    put:
      tags:
      - Operaciones
      summary: Editar una actividad pendiente
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      - name: actividadId
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActividadEntrada'
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actividad'
        '401':
          $ref: '#/components/responses/HTTP401'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
    delete:
      tags:
      - Operaciones
      summary: Retirar una actividad pendiente (administrador)
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      - name: actividadId
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      responses:
        '204':
          description: Operación completada
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
  /ciclos/{id}/actividades/{actividadId}/completar:
    post:
      tags:
      - Operaciones
      summary: Registrar ejecución y costo
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      - name: actividadId
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletarActividad'
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actividad'
        '401':
          $ref: '#/components/responses/HTTP401'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
  /ciclos/{id}/cosechas:
    post:
      tags:
      - Operaciones
      summary: Registrar cosecha en kg para un ciclo sembrado
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CosechaEntrada'
      responses:
        '201':
          description: Registro creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cosecha'
        '401':
          $ref: '#/components/responses/HTTP401'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
  /ciclos/{id}/cosechas/{cosechaId}:
    delete:
      tags:
      - Operaciones
      summary: Retirar una cosecha de un ciclo abierto (administrador)
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      - name: cosechaId
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      responses:
        '204':
          description: Operación completada
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
  /ciclos/{id}/consumos:
    post:
      tags:
      - Operaciones
      summary: Registrar aplicación de insumo y descontar stock
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumoEntrada'
      responses:
        '201':
          description: Registro creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovimientoRegistrado'
        '401':
          $ref: '#/components/responses/HTTP401'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
  /insumos/{id}/entradas:
    post:
      tags:
      - Operaciones
      summary: Ingresar stock (administrador o supervisor)
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsumoMovimiento'
      responses:
        '201':
          description: Registro creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovimientoRegistrado'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
  /insumos/{id}/movimientos:
    get:
      tags:
      - Operaciones
      summary: Consultar el historial de stock
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 1
        required: true
      - name: pagina
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: tam
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaMovimiento'
        '401':
          $ref: '#/components/responses/HTTP401'
        '404':
          $ref: '#/components/responses/HTTP404'
        '422':
          $ref: '#/components/responses/HTTP422'
  /reportes/indicadores:
    get:
      tags:
      - Productividad
      summary: Ver productividad por cultivo e indicadores generales
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Indicadores'
        '401':
          $ref: '#/components/responses/HTTP401'
  /reportes/ciclos:
    get:
      tags:
      - Productividad
      summary: Consultar ciclos y sus indicadores para comparar
      parameters:
      - name: pagina
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: tam
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
        description: Busca por código, terreno o cultivo.
      - name: estado
        in: query
        schema:
          type: string
          enum:
          - PLANIFICADO
          - SEMBRADO
          - CERRADO
      - name: cultivoId
        in: query
        schema:
          type: integer
          minimum: 1
      - name: terrenoId
        in: query
        schema:
          type: integer
          minimum: 1
      - name: desde
        in: query
        schema:
          type: string
          format: date
