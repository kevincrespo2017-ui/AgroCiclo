# Configuración de ejemplo para AgroCiclo
# Copiar como application.properties y completar los valores reales.

spring.application.name=agrociclo-api
server.port=4000
server.address=0.0.0.0
server.forward-headers-strategy=none
spring.main.banner-mode=off

PGHOST=localhost
PGPORT=5432
PGDATABASE=agrociclo
PGUSER=TU_USUARIO_POSTGRES
PGPASSWORD=TU_CONTRASENA_POSTGRES
DATABASE_URL=

FRONTEND_URL=http://localhost:4200
FRONTEND_ORIGINS=http://localhost:4200,http://127.0.0.1:4200

ADMIN_EMAIL=admin@ejemplo.com
ADMIN_PASSWORD=CAMBIAR_CONTRASENA

OPERATIVO_EMAIL=operativo@ejemplo.com
OPERATIVO_PASSWORD=CAMBIAR_CONTRASENA

SUPERVISOR_EMAIL=
SUPERVISOR_PASSWORD=

SEED_DEMO_DATA=true

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false

server.error.include-message=never
server.error.include-stacktrace=never

agrociclo.swagger.version=5.32.6

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=TU_CORREO
spring.mail.password=TU_CONTRASENA_DE_APLICACION
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
MAIL_FROM=TU_CORREO

GROQ_API_KEY=TU_CLAVE_GROQ
GROQ_MODEL=openai/gpt-oss-120b
GROQ_VISION_MODEL=qwen/qwen3.8-27b

agrociclo.archivos.directorio=${AGROCICLO_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
